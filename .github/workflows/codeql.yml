name: Analyse CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript

      - name: Construire
        uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939 # v4

      - name: Analyser
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
