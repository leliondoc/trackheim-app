name: Repository security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked private environment files
        shell: python
        run: |
          import pathlib, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          allowed = {'.env.example', '.env.sample', '.env.template', '.env.dist'}
          bad = [p for p in files if any((part == '.env' or part.startswith('.env.')) and part not in allowed for part in pathlib.PurePosixPath(p).parts)]
          if bad:
              raise SystemExit('Private environment files tracked: ' + ', '.join(bad))
      - name: Test public output protection
        run: node scripts/test-public-output.mjs
      - name: Scan tracked history and files
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact=100 --log-opts="--all --no-textconv"
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact=100

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        directory: ['.']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '>=24.22.1 <25'
          check-latest: true
      - name: Require patched Node.js
        run: |
          node -e 'const [major, minor, patch] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) throw new Error("Node.js 24.22.1 minimum required"); console.log(process.version)'
      - name: Audit all locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
